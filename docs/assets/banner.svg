  <!-- wordmark -->
  <text x="90" y="128" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="14" fill="#F2F3F7">KATSUKI</text>
  <text x="92" y="192" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="300" letter-spacing="18" fill="#AEB3C2">DESKTOP</text>
  <rect x="92" y="216" width="330" height="2" rx="1" fill="url(#accentSoft)" opacity="0.85"/>

  <!-- tagline -->
  <text x="92" y="252" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#8B91A5">a music-first Telegram client · Sound Glass design language</text>
