<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#7C5CFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.92" r="0.9">
      <stop offset="0%" stop-color="#4EA8FF" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#4EA8FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4EA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.72" cy="0.1" r="0.5">
      <stop offset="0%" stop-color="#3ED598" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3ED598" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4EA8FF"/>
    </linearGradient>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4EA8FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="380" rx="24" fill="#0A0B0F"/>
  <rect width="1200" height="380" rx="24" fill="url(#glowA)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glowB)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glowC)"/>

  <!-- vinyl, right -->
  <g transform="translate(1015 190)">
    <circle r="128" fill="#101219" stroke="url(#glassStroke)" stroke-width="1.5"/>
    <circle r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    <circle r="97" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    <circle r="82" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="67" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    <circle r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="42" fill="url(#accent)"/>
    <circle r="42" fill="#0A0B0F" fill-opacity="0.25"/>
    <circle r="7" fill="#0A0B0F"/>
    <circle r="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- equalizer, bottom -->
  <g transform="translate(90 286)" fill="url(#accentSoft)">
    <rect x="0"   y="-18" width="9" height="18" rx="4.5" opacity="0.95"/>
    <rect x="22"  y="-34" width="9" height="34" rx="4.5" opacity="0.9"/>
    <rect x="44"  y="-12" width="9" height="12" rx="4.5" opacity="0.85"/>
    <rect x="66"  y="-44" width="9" height="44" rx="4.5" opacity="0.95"/>
    <rect x="88"  y="-24" width="9" height="24" rx="4.5" opacity="0.8"/>
    <rect x="110" y="-52" width="9" height="52" rx="4.5" opacity="0.9"/>
    <rect x="132" y="-16" width="9" height="16" rx="4.5" opacity="0.8"/>
    <rect x="154" y="-38" width="9" height="38" rx="4.5" opacity="0.95"/>
    <rect x="176" y="-26" width="9" height="26" rx="4.5" opacity="0.85"/>
    <rect x="198" y="-48" width="9" height="48" rx="4.5" opacity="0.9"/>
    <rect x="220" y="-14" width="9" height="14" rx="4.5" opacity="0.8"/>
    <rect x="242" y="-30" width="9" height="30" rx="4.5" opacity="0.9"/>
    <rect x="264" y="-46" width="9" height="46" rx="4.5" opacity="0.95"/>
    <rect x="286" y="-20" width="9" height="20" rx="4.5" opacity="0.8"/>
